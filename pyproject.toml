[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "semcacher"
dynamic = ["version"]
description = "A semantic cache for LLM calls: reuse answers to questions that mean the same thing, and track hit rate and money saved."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Japanjot Singh" }]
keywords = ["llm", "cache", "semantic-cache", "embeddings", "openai", "anthropic", "claude", "cost"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
local = ["sentence-transformers>=2.2"]
openai = ["openai>=1.0"]
redis = ["redis>=5"]
dev = ["pytest>=7", "ruff>=0.4", "fakeredis>=2.20"]

[project.urls]
Homepage = "https://github.com/sjapanjots/Semantic_Cache_LLM"
Issues = "https://github.com/sjapanjots/Semantic_Cache_LLM/issues"
Changelog = "https://github.com/sjapanjots/Semantic_Cache_LLM/blob/main/CHANGELOG.md"

[project.scripts]
semcache = "semcache.cli:main"

[tool.hatch.version]
path = "src/semcache/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/semcache"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
